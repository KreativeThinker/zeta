name: Proto

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - '.github/workflows/proto.yml'
  pull_request:
    paths:
      - 'proto/**'
      - '.github/workflows/proto.yml'

jobs:
  lint:
    name: Lint & Breaking Change Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install buf
        uses: bufbuild/buf-action@v1

      - name: Lint
        run: cd proto && buf lint

      - name: Breaking change detection
        run: cd proto && buf breaking --against '../.git#branch=main'
        continue-on-error: true  # warn only on PRs; enforce on release

  generate:
    name: Generate & Verify No Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install protoc-gen-go + protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install buf
        uses: bufbuild/buf-action@v1

      - name: Generate
        run: cd proto && buf generate

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "Generated files are out of sync. Run 'make proto' and commit."
            exit 1
          fi
