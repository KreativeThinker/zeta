name: Agent (Linux)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'proto/**'
      - '.github/workflows/agent-linux.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'proto/**'
      - '.github/workflows/agent-linux.yml'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum


      - name: Test
        working-directory: agent
        run: go test ./... -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: agent/coverage.out

  build:
    name: Build
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64] # arm64, arm]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum

      - name: Build
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w \
            -X main.Version=${{ github.ref_name }} \
            -X main.Commit=${{ github.sha }}" \
            -o ../dist/zeta-agent-linux-${{ matrix.goarch }} \
            ./cmd/agent

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-${{ matrix.goarch }}
          path: dist/

  docker:
    name: Docker Build
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: agent/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kreativethinker/zeta/agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Cross-compile binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          for arch in amd64; do
            GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT" \
              -o dist/zeta-agent-linux-$arch \
              ./agent/cmd/agent
          done

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agent-linux-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
