<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Logs · Zeta Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        Zeta
        <span id="agent-hostname">agent</span>
      </div>
      <a href="/" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Services
      </a>
      <a href="/logs.html" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
        Access Logs
      </a>
      <div style="flex:1"></div>
      <div class="nav-info" id="mesh-ip"></div>
    </aside>

    <main class="main">
      <div class="top-bar">
        <div>
          <div class="page-title">Access Logs</div>
          <div class="page-sub" id="log-count">Loading…</div>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-refresh">Refresh</button>
      </div>

      <div class="table-wrap" id="content">
        <div class="loading">Loading…</div>
      </div>
    </main>
  </div>

  <script>
    async function loadStatus() {
      try {
        const r = await fetch('/api/status');
        const s = await r.json();
        document.getElementById('agent-hostname').textContent = (s.hostname || '').split('.')[0] || 'agent';
        document.getElementById('mesh-ip').textContent = s.mesh_ip || '';
      } catch {}
    }

    async function load() {
      try {
        const r = await fetch('/api/logs');
        const events = await r.json() || [];
        render(events);
      } catch (e) {
        document.getElementById('content').innerHTML = `<div class="empty"><p>Error: ${e.message}</p></div>`;
      }
    }

    function fmt(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function render(events) {
      document.getElementById('log-count').textContent =
        `${events.length} event${events.length === 1 ? '' : 's'} (last 500)`;

      if (events.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="empty">
            <div class="empty-icon">📋</div>
            <p>No access events yet.</p>
            <p style="margin-top:0.5rem">Events are recorded when peers connect to your services.</p>
          </div>`;
        return;
      }

      const rows = events.map(ev => {
        const badge = ev.allowed
          ? `<span class="badge badge-online"><span class="badge-dot"></span>allowed</span>`
          : `<span class="badge badge-offline"><span class="badge-dot"></span>denied</span>`;
        const peer = ev.hostname
          ? `<strong>${esc(ev.hostname)}</strong> <span class="sub">${esc(ev.source_ip)}</span>`
          : `<span class="mono">${esc(ev.source_ip)}</span>`;
        return `
          <tr>
            <td>${badge}</td>
            <td style="font-weight:600;color:var(--accent)">${esc(ev.service)}</td>
            <td>${peer}</td>
            <td class="sub">${fmt(ev.time)}</td>
          </tr>`;
      }).join('');

      document.getElementById('content').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Result</th>
              <th>Service</th>
              <th>Peer</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('btn-refresh').addEventListener('click', load);

    loadStatus();
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
