services:
  controller:
    image: ghcr.io/kreativethinker/zeta/controller:main
    restart: unless-stopped
    ports:
      - "8080:8080"    # REST API + admin UI
      - "50051:50051"  # gRPC (agents connect here)
    volumes:
      - controller-data:/data
    environment:
      ZETA_DB_PATH: /data/zeta.db
      ZETA_HTTP_ADDR: ":8080"
      ZETA_GRPC_ADDR: ":50051"
      ZETA_MESH_DOMAIN: mesh
      # ZETA_MESH_CIDR: "100.64.0.0/10"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  controller-data:
