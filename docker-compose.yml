services:
  controller:
    image: ghcr.io/kreativethinker/zeta/controller:main
    restart: unless-stopped
    ports:
      - "8080:8080"    # REST API + admin UI
      - "50051:50051"  # gRPC (agents connect here)
    volumes:
      - controller-data:/data
    environment:
      ZETA_DB_PATH: /data/zeta.db
      ZETA_HTTP_ADDR: ":8080"
      ZETA_GRPC_ADDR: ":50051"
      ZETA_MESH_DOMAIN: mesh
      ZETA_ADMIN_PASSWORD: ${ZETA_ADMIN_PASSWORD:-}
      # ZETA_MESH_CIDR: "100.64.0.0/10"

  # Agent running on this host — joins the mesh so the server itself
  # is reachable at its mesh IP from other enrolled devices.
  #
  # First run: set ZETA_PREAUTH_KEY to a key generated from the dashboard.
  # Subsequent runs: state is loaded from the volume; ZETA_PREAUTH_KEY is ignored.
  #
  # network_mode: host is required — WireGuard must live in the host network
  # namespace so the mesh IP is assigned to the host, not just the container.
  agent:
    image: ghcr.io/kreativethinker/zeta/agent:main
    restart: unless-stopped
    network_mode: host
    privileged: true          # needed for WireGuard + ip route
    depends_on:
      - controller
    volumes:
      - agent-data:/var/lib/zeta
    environment:
      ZETA_COORDINATOR: "localhost:50051"
    command:
      - "--coordinator=localhost:50051"
      - "--preauth-key=${ZETA_PREAUTH_KEY:-}"

volumes:
  controller-data:
  agent-data:
